<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة إدارة وتوثيق الإنجازات اليومية</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- SheetJS لتصدير ملفات إكسل -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Firebase App & Services (Compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Cairo', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- ================= شاشة تسجيل الدخول ================= -->
  <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 w-full max-w-md">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl mb-4 shadow-sm">
          <i class="fa-solid fa-briefcase text-2xl"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-800">بوابة الإنجازات المؤسسية</h1>
        <p class="text-slate-500 text-sm mt-1">سجّل الدخول للوصول إلى لوحة التحكم والتقارير</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">البريد الإلكتروني</label>
          <div class="relative">
            <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
              <i class="fa-regular fa-envelope"></i>
            </span>
            <input type="email" id="loginEmail" required placeholder="name@example.com"
                   class="w-full pr-10 pl-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition text-sm">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">كلمة المرور</label>
          <div class="relative">
            <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="loginPassword" required placeholder="••••••••"
                   class="w-full pr-10 pl-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition text-sm">
          </div>
        </div>

        <div id="loginError" class="hidden p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-xl font-medium text-center leading-relaxed"></div>

        <button type="submit" id="loginBtn"
                class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-600/20 transition duration-150 flex items-center justify-center gap-2">
          <span>دخول للنظام</span>
          <i class="fa-solid fa-arrow-left"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- ================= لوحة التحكم الرئيسية (تظهر بعد الدخول) ================= -->
  <div id="appSection" class="hidden flex-1 flex flex-col">
    <!-- شريط علوي -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold shadow-md shadow-blue-600/20">
            <i class="fa-solid fa-list-check"></i>
          </div>
          <div>
            <h2 class="font-bold text-slate-800 text-base sm:text-lg">نظام توثيق الإنجازات اليومية</h2>
            <p id="userDisplay" class="text-xs text-slate-500"></p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button id="openAddModalBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 shadow-sm transition">
            <i class="fa-solid fa-plus"></i>
            <span class="hidden sm:inline">إضافة إنجاز</span>
          </button>
          <button id="exportExcelBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 shadow-sm transition">
            <i class="fa-solid fa-file-excel"></i>
            <span class="hidden sm:inline">تصدير إكسل</span>
          </button>
          <button id="logoutBtn" title="تسجيل الخروج" class="p-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-xl transition">
            <i class="fa-solid fa-right-from-bracket text-lg"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- المحتوى -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
      <!-- بطاقات الإحصائيات -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
          <div>
            <p class="text-xs text-slate-500 font-semibold">إجمالي الإنجازات</p>
            <h3 id="statTotal" class="text-2xl font-black text-slate-800 mt-1">0</h3>
          </div>
          <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl">
            <i class="fa-solid fa-layer-group"></i>
          </div>
        </div>

        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
          <div>
            <p class="text-xs text-slate-500 font-semibold">إنجازات اليوم</p>
            <h3 id="statToday" class="text-2xl font-black text-emerald-600 mt-1">0</h3>
          </div>
          <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">
            <i class="fa-solid fa-calendar-day"></i>
          </div>
        </div>

        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
          <div>
            <p class="text-xs text-slate-500 font-semibold">المستفيدون</p>
            <h3 id="statBeneficiaries" class="text-2xl font-black text-purple-600 mt-1">0</h3>
          </div>
          <div class="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-xl">
            <i class="fa-solid fa-users"></i>
          </div>
        </div>

        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
          <div>
            <p class="text-xs text-slate-500 font-semibold">الإدارات المخدومة</p>
            <h3 id="statDepts" class="text-2xl font-black text-amber-600 mt-1">0</h3>
          </div>
          <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl">
            <i class="fa-solid fa-building"></i>
          </div>
        </div>
      </div>

      <!-- فلترة وبحث -->
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-3 items-center justify-between">
        <div class="relative w-full md:w-96">
          <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400">
            <i class="fa-solid fa-magnifying-glass"></i>
          </span>
          <input type="text" id="searchInput" placeholder="بحث بالاسم، الإدارة، الخدمة، أو الحل..."
                 class="w-full pr-10 pl-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
        </div>

        <div class="flex items-center gap-2 w-full md:w-auto">
          <input type="date" id="filterDate" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 outline-none">
          <button id="resetFilterBtn" class="px-3 py-2 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition">
            إعادة تعيين
          </button>
        </div>
      </div>

      <!-- جدول الإنجازات -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-right border-collapse text-sm">
            <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 font-bold">
              <tr>
                <th class="py-3 px-4">#</th>
                <th class="py-3 px-4">التاريخ</th>
                <th class="py-3 px-4">اسم المستفيد</th>
                <th class="py-3 px-4">الإدارة</th>
                <th class="py-3 px-4">الخدمة المطلوبة</th>
                <th class="py-3 px-4">الحل والإجراء</th>
                <th class="py-3 px-4 text-center">إجراءات</th>
              </tr>
            </thead>
            <tbody id="achievementsTableBody" class="divide-y divide-slate-100 text-slate-700">
              <tr>
                <td colspan="7" class="text-center py-10 text-slate-400">
                  <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                  <p>جاري تحميل البيانات...</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ================= نافذة إضافة / تعديل إنجاز ================= -->
  <div id="recordModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-lg overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 id="modalTitle" class="font-bold text-slate-800 text-lg">إضافة إنجاز جديد</h3>
        <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="recordForm" class="p-6 space-y-4">
        <input type="hidden" id="editDocId">
        
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">التاريخ</label>
          <input type="date" id="formDate" required class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-600 outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">اسم المستفيد</label>
          <input type="text" id="formBeneficiary" required placeholder="أدخل اسم المستفيد" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-600 outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">الإدارة / القسم</label>
          <input type="text" id="formDepartment" required placeholder="مثال: إدارة تقنية المعلومات" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-600 outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">الخدمة المطلوبة</label>
          <textarea id="formService" required rows="2" placeholder="وصف موجز للمشكلة أو الطلب..." class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-600 outline-none resize-none"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">الحل والإجراء المتخذ</label>
          <textarea id="formResolution" required rows="3" placeholder="تفاصيل المعالجة والإنجاز..." class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-600 outline-none resize-none"></textarea>
        </div>

        <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100">
          <button type="button" id="cancelModalBtn" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-xl transition font-medium">إلغاء</button>
          <button type="submit" id="saveRecordBtn" class="px-5 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition font-bold shadow-md shadow-blue-600/20">حفظ الإنجاز</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= السكريبت ================= -->
  <script>
    // 1. إعدادات Firebase الخاصة بك
    const firebaseConfig = {
      apiKey: "AIzaSyCdAJbhASinCo7gX7JjhNUDyftsZ8-CI9I",
      authDomain: "achievements-portal.firebaseapp.com",
      projectId: "achievements-portal",
      storageBucket: "achievements-portal.firebasestorage.app",
      messagingSenderId: "584785864961",
      appId: "1:584785864961:web:ca84d9cb25c7ff8dff5300",
      measurementId: "G-PYPV4ML73X"
    };

    // تهيئة Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let achievementsData = [];
    let unsubscribeFirestore = null;

    // عناصر الواجهة
    const loginSection = document.getElementById('loginSection');
    const appSection = document.getElementById('appSection');
    const loginForm = document.getElementById('loginForm');
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginError = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userDisplay = document.getElementById('userDisplay');

    const tableBody = document.getElementById('achievementsTableBody');
    const searchInput = document.getElementById('searchInput');
    const filterDate = document.getElementById('filterDate');
    const resetFilterBtn = document.getElementById('resetFilterBtn');
    const exportExcelBtn = document.getElementById('exportExcelBtn');

    const recordModal = document.getElementById('recordModal');
    const openAddModalBtn = document.getElementById('openAddModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const cancelModalBtn = document.getElementById('cancelModalBtn');
    const recordForm = document.getElementById('recordForm');
    const modalTitle = document.getElementById('modalTitle');
    const editDocId = document.getElementById('editDocId');
    const formDate = document.getElementById('formDate');
    const formBeneficiary = document.getElementById('formBeneficiary');
    const formDepartment = document.getElementById('formDepartment');
    const formService = document.getElementById('formService');
    const formResolution = document.getElementById('formResolution');

    // ضبط تاريخ اليوم افتراضياً
    formDate.value = new Date().toISOString().split('T')[0];

    // مراقبة حالة المصادقة
    auth.onAuthStateChanged(user => {
      if (user) {
        loginSection.classList.add('hidden');
        appSection.classList.remove('hidden');
        userDisplay.textContent = `المستخدم: ${user.email}`;
        subscribeToData();
      } else {
        loginSection.classList.remove('hidden');
        appSection.classList.add('hidden');
        if (unsubscribeFirestore) unsubscribeFirestore();
      }
    });

    // تسجيل الدخول
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.add('hidden');
      loginBtn.disabled = true;
      loginBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>جاري التحقق...</span>`;

      try {
        await auth.signInWithEmailAndPassword(loginEmail.value.trim(), loginPassword.value);
      } catch (err) {
        loginError.classList.remove('hidden');
        if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
          loginError.textContent = "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
        } else if (err.code === 'auth/unauthorized-domain') {
          loginError.textContent = "النطاق غير مصرح به في Firebase. يرجى إضافة halshuhib.github.io في Authorized Domains.";
        } else {
          loginError.textContent = `خطأ (${err.code}): ${err.message}`;
        }
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = `<span>دخول للنظام</span> <i class="fa-solid fa-arrow-left"></i>`;
      }
    });

    // تسجيل الخروج
    logoutBtn.addEventListener('click', () => {
      auth.signOut();
    });

    // جلب البيانات لحظياً من Firestore
    function subscribeToData() {
      unsubscribeFirestore = db.collection('achievements')
        .orderBy('date', 'desc')
        .onSnapshot(snapshot => {
          achievementsData = [];
          snapshot.forEach(doc => {
            achievementsData.push({ id: doc.id, ...doc.data() });
          });
          renderTable();
          updateStats();
        }, err => {
          console.error("Firestore error:", err);
          tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-red-500 font-semibold">تعذر قراءة البيانات: تأكد من إعدادات الـ Rules في Firestore</td></tr>`;
        });
    }

    // رسم الجدول
    function renderTable() {
      const q = searchInput.value.toLowerCase().trim();
      const fDate = filterDate.value;

      const filtered = achievementsData.filter(item => {
        const matchesQuery = !q || 
          (item.beneficiary && item.beneficiary.toLowerCase().includes(q)) ||
          (item.department && item.department.toLowerCase().includes(q)) ||
          (item.service && item.service.toLowerCase().includes(q)) ||
          (item.resolution && item.resolution.toLowerCase().includes(q));

        const matchesDate = !fDate || item.date === fDate;
        return matchesQuery && matchesDate;
      });

      if (filtered.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400">لا توجد إنجازات مطابقة للبحث</td></tr>`;
        return;
      }

      tableBody.innerHTML = filtered.map((item, idx) => `
        <tr class="hover:bg-slate-50 transition border-b border-slate-100">
          <td class="py-3 px-4 font-mono text-xs text-slate-400">${idx + 1}</td>
          <td class="py-3 px-4 text-xs font-semibold text-slate-600 whitespace-nowrap">${item.date || '-'}</td>
          <td class="py-3 px-4 font-bold text-slate-800">${item.beneficiary || '-'}</td>
          <td class="py-3 px-4"><span class="px-2.5 py-1 bg-blue-50 text-blue-700 text-xs font-semibold rounded-lg">${item.department || '-'}</span></td>
          <td class="py-3 px-4 text-xs text-slate-600 max-w-xs truncate" title="${item.service}">${item.service || '-'}</td>
          <td class="py-3 px-4 text-xs text-slate-600 max-w-xs truncate" title="${item.resolution}">${item.resolution || '-'}</td>
          <td class="py-3 px-4 text-center whitespace-nowrap">
            <button onclick="editRecord('${item.id}')" class="text-blue-600 hover:text-blue-800 p-1 mx-1" title="تعديل"><i class="fa-regular fa-pen-to-square"></i></button>
            <button onclick="deleteRecord('${item.id}')" class="text-red-500 hover:text-red-700 p-1 mx-1" title="حذف"><i class="fa-regular fa-trash-can"></i></button>
          </td>
        </tr>
      `).join('');
    }

    // تحديث الإحصائيات
    function updateStats() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('statTotal').textContent = achievementsData.length;
      document.getElementById('statToday').textContent = achievementsData.filter(x => x.date === today).length;
      
      const beneficiaries = new Set(achievementsData.map(x => x.beneficiary).filter(Boolean));
      document.getElementById('statBeneficiaries').textContent = beneficiaries.size;

      const depts = new Set(achievementsData.map(x => x.department).filter(Boolean));
      document.getElementById('statDepts').textContent = depts.size;
    }

    // التصفية والبحث
    searchInput.addEventListener('input', renderTable);
    filterDate.addEventListener('change', renderTable);
    resetFilterBtn.addEventListener('click', () => {
      searchInput.value = '';
      filterDate.value = '';
      renderTable();
    });

    // التحكم في المودال (إضافة / تعديل)
    openAddModalBtn.addEventListener('click', () => {
      modalTitle.textContent = "إضافة إنجاز جديد";
      editDocId.value = '';
      recordForm.reset();
      formDate.value = new Date().toISOString().split('T')[0];
      recordModal.classList.remove('hidden');
      recordModal.classList.add('flex');
    });

    function closeModal() {
      recordModal.classList.add('hidden');
      recordModal.classList.remove('flex');
    }
    closeModalBtn.addEventListener('click', closeModal);
    cancelModalBtn.addEventListener('click', closeModal);

    // حفظ أو تعديل إنجاز في Firestore
    recordForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = editDocId.value;
      const data = {
        date: formDate.value,
        beneficiary: formBeneficiary.value.trim(),
        department: formDepartment.value.trim(),
        service: formService.value.trim(),
        resolution: formResolution.value.trim(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        if (id) {
          await db.collection('achievements').doc(id).update(data);
        } else {
          data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('achievements').add(data);
        }
        closeModal();
      } catch (err) {
        alert("حدث خطأ أثناء الحفظ: " + err.message);
      }
    });

    // تعديل
    window.editRecord = function(id) {
      const item = achievementsData.find(x => x.id === id);
      if (!item) return;
      modalTitle.textContent = "تعديل الإنجاز";
      editDocId.value = item.id;
      formDate.value = item.date || '';
      formBeneficiary.value = item.beneficiary || '';
      formDepartment.value = item.department || '';
      formService.value = item.service || '';
      formResolution.value = item.resolution || '';
      recordModal.classList.remove('hidden');
      recordModal.classList.add('flex');
    };

    // حذف
    window.deleteRecord = async function(id) {
      if (confirm("هل أنت متأكد من حذف هذا السجل؟")) {
        try {
          await db.collection('achievements').doc(id).delete();
        } catch (err) {
          alert("تعذر الحذف: " + err.message);
        }
      }
    };

    // تصدير إكسل بنظام RTL
    exportExcelBtn.addEventListener('click', () => {
      if (achievementsData.length === 0) {
        alert("لا توجد بيانات متاحة للتصدير حالياً.");
        return;
      }

      const rows = achievementsData.map((item, index) => ({
        "م": index + 1,
        "التاريخ": item.date || '',
        "اسم المستفيد": item.beneficiary || '',
        "الإدارة": item.department || '',
        "الخدمة المطلوبة": item.service || '',
        "الحل والإجراء": item.resolution || ''
      }));

      const worksheet = XLSX.utils.json_to_sheet(rows);
      worksheet['!dir'] = "rtl";

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "سجل الإنجازات");

      const today = new Date().toISOString().split('T')[0];
      XLSX.writeFile(workbook, `تقرير_الانجازات_${today}.xlsx`);
    });
  </script>
</body>
</html>
